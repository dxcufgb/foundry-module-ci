# Tests the shared scripts and actions on every push and pull request:
#   - test/run.sh: the checks and packaging against test/fixture-module, including failure cases
#   - shellcheck on every script
#   - the check action itself, as a module would call it
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Shellcheck
        run: shellcheck scripts/*.sh test/*.sh

      - name: Tests
        run: bash test/run.sh

  action:
    name: Check action on the fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./check
        with:
          working-directory: test/fixture-module
