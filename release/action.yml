name: Release Foundry module
description: >-
  Releases a dxcufgb Foundry VTT module. On "Run workflow" with a version it checks and builds everything,
  then creates and publishes the release vX.Y.Z with module.json and module.zip. On a release published by
  hand it attaches the two files to that release. Run it after actions/checkout; needs contents: write.
inputs:
  version:
    description: Version to release, e.g. 1.2.3 (used when the workflow is run by hand).
    required: false
    default: ""
  github-token:
    description: Token used to create the release (pass github.token).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        package-manager-cache: false

    - name: Release
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION_INPUT: ${{ inputs.version }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "$ACTION_PATH/../scripts/release.sh"
