name: Release Foundry module
description: >-
  Releases a dxcufgb Foundry VTT module. On "Run workflow" with a version it checks and builds everything,
  then creates and publishes the release vX.Y.Z with module.json and module.zip. On a release published by
  hand it attaches the two files to that release. Run it after actions/checkout; needs contents: write.
inputs:
  version:
    description: Version to release, e.g. 1.2.3 (used when the workflow is run by hand).
    required: false
    default: ""
  github-token:
    description: Token used to create the release (pass github.token).
    required: true
  site-dispatch-token:
    description: >-
      Optional. A fine-grained token with Contents read and write on the Workshop site repository (pass
      secrets.SITE_DISPATCH_TOKEN). When set, the site is asked to rebuild after the release is published; a failed
      ping is only a warning. Empty: no ping (the site's schedule still picks the release up).
    required: false
    default: ""
  site-repository:
    description: The Workshop site repository to ask for a rebuild (owner/repo).
    required: false
    default: dxcufgb/FVTT-dev-showcase
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        package-manager-cache: false

    - name: Release
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION_INPUT: ${{ inputs.version }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "$ACTION_PATH/../scripts/release.sh"

    - name: Ask the Workshop site to rebuild
      if: inputs.site-dispatch-token != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.site-dispatch-token }}
        SITE_REPOSITORY: ${{ inputs.site-repository }}
        VERSION_INPUT: ${{ inputs.version }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
      run: bash "$ACTION_PATH/../scripts/notify-site.sh"
